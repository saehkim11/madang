<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>온라인 서점</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page">
    <header class="page-header">
      <p class="eyebrow">ONLINE BOOKSTORE</p>
      <h1>온라인 서점</h1>
      <p>원하는 도서 제목을 검색해 보세요.</p>
    </header>

    <section class="auth-card" aria-labelledby="authHeading">
      <div class="auth-heading">
        <div>
          <h2 id="authHeading">회원</h2>
          <p id="accountEmail">로그인하면 구매 기능을 이용할 수 있습니다.</p>
        </div>
        <button id="logoutButton" type="button" class="logout-button" hidden>로그아웃</button>
      </div>

      <div id="authForms" class="auth-forms">
        <form id="signUpForm" class="auth-form">
          <h3>회원가입</h3>
          <label for="signUpEmail">이메일</label>
          <input id="signUpEmail" name="email" type="email" autocomplete="email" required>
          <label for="signUpPassword">비밀번호</label>
          <input id="signUpPassword" name="password" type="password" autocomplete="new-password" minlength="6" required>
          <button id="signUpButton" type="submit">회원가입</button>
        </form>

        <form id="signInForm" class="auth-form">
          <h3>로그인</h3>
          <label for="signInEmail">이메일</label>
          <input id="signInEmail" name="email" type="email" autocomplete="email" required>
          <label for="signInPassword">비밀번호</label>
          <input id="signInPassword" name="password" type="password" autocomplete="current-password" required>
          <button id="signInButton" type="submit">로그인</button>
        </form>
      </div>
      <p id="authStatus" class="auth-status" role="status" aria-live="polite"></p>
    </section>

    <section class="search-card" aria-label="도서 검색">
      <form id="searchForm">
        <label for="searchInput">도서 제목 검색</label>
        <div class="search-row">
          <input id="searchInput" type="search" placeholder="예: 바이브 코딩" autocomplete="off">
          <button type="submit">검색</button>
        </div>
      </form>
    </section>

    <p id="status" class="status" role="status" aria-live="polite">도서 목록을 불러올 준비를 합니다.</p>
    <section id="bookList" class="book-list" aria-label="도서 목록"></section>

    <section class="orders-card" aria-labelledby="ordersHeading">
      <div class="orders-heading">
        <div>
          <h2 id="ordersHeading">내 주문</h2>
          <p>로그인한 회원의 모의 구매 내역입니다.</p>
        </div>
      </div>
      <p id="purchaseStatus" class="purchase-status" role="status" aria-live="polite"></p>
      <p id="ordersStatus" class="orders-status" role="status" aria-live="polite">로그인하면 내 주문을 확인할 수 있습니다.</p>
      <div id="ordersList" class="orders-list" aria-label="내 주문 목록"></div>
    </section>
  </main>

  <!-- Supabase SDK를 먼저 불러온 뒤 config.js와 app.js를 실행합니다. -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
